name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build
        run: |
          cd frontend
          npm run build
      
      - name: Prepare artifact (CNAME, images, 404)
        run: |
          # Copy custom domain CNAME into dist if present
          if [ -f CNAME ]; then cp CNAME frontend/dist/CNAME; fi
          # Ensure images used by the app are available at /images/*
          mkdir -p frontend/dist/images
          if [ -d images ]; then cp -R images/* frontend/dist/images/; fi
          # Copy images 2 folder for new performance content
          if [ -d "frontend/public/images 2" ]; then cp -R "frontend/public/images 2" frontend/dist/; fi
          # React Router fallback for GitHub Pages
          cp frontend/dist/index.html frontend/dist/404.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
