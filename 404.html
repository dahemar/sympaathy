<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/#" />
    <script>
      (function() {
        var l = window.location;
        var redirect = l.origin + '/#' + l.pathname + l.search + l.hash;
        window.location.replace(redirect);
      })();
    </script>
  </head>
